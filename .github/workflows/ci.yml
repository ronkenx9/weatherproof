name: verify

on:
  push:
  pull_request:

jobs:
  scorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --check
      - run: cargo test
      - run: ./scripts/build.sh
      - run: cmp dist/weatherproof.wasm target/wasm32-unknown-unknown/release/weatherproof_scorer.wasm
      - run: node scripts/verify.mjs
